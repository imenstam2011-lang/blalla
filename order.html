<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAPSE.VP | Order</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-[#0a0a0c] text-gray-100 min-h-screen">
  <header class="sticky top-0 z-50 bg-[#0a0a0c]/95 backdrop-blur-md border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-3">
      <a href="index.html" class="flex items-center gap-3 text-white font-bold text-lg min-w-0">
        <img src="public/napse-logo.png" loading="lazy" decoding="async" alt="Napse Logo" class="w-10 h-10 rounded-full object-contain flex-shrink-0" />
        Napse<span class="text-purple-400">.vp</span>
      </a>
      <nav class="hidden md:flex items-center gap-6 text-sm text-gray-300">
        <a href="index.html" class="hover:text-white">Accueil</a>
         <a href="terms.html" class="hover:text-white">Terms📃</a>
    <a href="Feedback.html" class="hover:text-white">Feedbacks🪬</a>
        <a href="order.html" class="text-white">Order🛒</a>
      </nav>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-12 sm:py-16">
    <section class="text-center mb-12">
      <p class="text-sm uppercase tracking-[0.3em] text-purple-400 mb-4">Order</p>
      <h1 class="text-4xl md:text-5xl font-black text-white mb-4">Formulaire de commande</h1>
      <p class="text-gray-400">Remplissez le formulaire ci-dessous pour confirmer votre commande. Nous envoyons toutes les informations au bot de commande.</p>
    </section>

    <section class="bg-[#121217] border border-white/10 rounded-3xl p-8 shadow-lg">
      <h2 class="text-xl font-bold text-white mb-6">Détails de la commande</h2>
      <form id="orderForm" class="space-y-6">
        <div>
          <label for="orderName" class="block text-sm font-medium text-gray-300 mb-2">Full Name</label>
          <input type="text" id="orderName" required class="w-full rounded-2xl bg-[#0a0a0c] border border-white/10 px-4 py-3 text-white focus:outline-none focus:border-purple-500" />
        </div>

        <div>
          <label for="orderPhone" class="block text-sm font-medium text-gray-300 mb-2">Phone Number</label>
          <input type="tel" id="orderPhone" required class="w-full rounded-2xl bg-[#0a0a0c] border border-white/10 px-4 py-3 text-white focus:outline-none focus:border-purple-500" />
        </div>

        <div>
          <label for="orderCity" class="block text-sm font-medium text-gray-300 mb-2">City / Adresse</label>
          <input type="text" id="orderCity" required class="w-full rounded-2xl bg-[#0a0a0c] border border-white/10 px-4 py-3 text-white focus:outline-none focus:border-purple-500" />
        </div>

        <div>
          <label for="orderProduct" class="block text-sm font-medium text-gray-300 mb-2">Product</label>
          <input type="text" id="orderProduct" required class="w-full rounded-2xl bg-[#0a0a0c] border border-white/10 px-4 py-3 text-white focus:outline-none focus:border-purple-500" placeholder="Ex: Napse Salt Nic 30ml - 45 DT" />
        </div>

        <button type="submit" class="w-full rounded-2xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-semibold py-3 shadow-[0_0_20px_rgba(168,85,247,0.3)] hover:from-purple-500 hover:to-indigo-500 transition-all">Submit Order</button>
      </form>
    </section>
  </main>

  <script>
    const orderForm = document.getElementById('orderForm');
    orderForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('orderName').value.trim();
      const phone = document.getElementById('orderPhone').value.trim();
      const city = document.getElementById('orderCity').value.trim();
      const product = document.getElementById('orderProduct').value.trim();

      if (!name || !phone || !city || !product) {
        alert('Please fill all fields.');
        return;
      }

      const payload = {
        username: 'Order Bot',
        avatar_url: 'https://i.imgur.com/AfFp7pu.png',
        embeds: [
          {
            title: '🛒 Nouvelle Demande d\'Order',
            color: 0xA855F7,
            fields: [
              { name: '👤 Full Name', value: name, inline: false },
              { name: '📞 Phone Number', value: phone, inline: true },
              { name: '📍 City / Adresse', value: city, inline: true },
              { name: '📦 Product', value: product, inline: false }
            ],
            footer: { text: 'NAPSE.VP Order System' },
            timestamp: new Date().toISOString()
          }
        ]
      };

      try {
        await fetch('https://discord.com/api/webhooks/1532614725786009680/ULFqOB7WQ42YTjzaiCyX0O2oIUFfaJzlnV52yQppFLtCh1W-Xys8T_RAW00wMSU1KEDO', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
                    <a href="order.html" class="text-white">Order🛒</a>
        alert('Order submitted successfully!');
        orderForm.reset();
                <div class="flex items-center gap-3">
                  <button id="mobileMenuBtnOrder" aria-controls="mobileMenuOrder" aria-expanded="false" class="md:hidden p-2 rounded-lg text-white hover:bg-white/5" title="Open menu">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
                  </button>
                </div>
              /header>

              <div id="mobileMenuOrder" class="fixed inset-0 z-40 hidden md:hidden">
                <div class="absolute inset-0 bg-black/40"></div>
                <div class="absolute right-0 top-0 h-full w-64 bg-[#0a0a0c] text-white shadow-lg p-6 overflow-y-auto">
                  <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-3">
                      <img src="public/napse-logo.png" alt="NAPSE" class="w-10 h-10 rounded-full object-contain" />
                      <span class="font-bold">Napse.vp</span>
                    </div>
                    <button id="mobileMenuCloseOrder" class="p-2 rounded-md text-white hover:bg-white/5">✕</button>
                  </div>
                  <nav class="flex flex-col gap-4 text-white">
                    <a href="index.html" class="py-2">Accueil</a>
                    <a href="terms.html" class="py-2">Terms</a>
                    <a href="Feedback.html" class="py-2">Feedback🪬</a>
                  </nav>
                </div>
              </div>
      } catch (err) {
        console.error(err);
        alert('Request failed. Please try again.');
      }
    });
  </script>
    <script>
      // Mobile menu toggle for Order
      document.addEventListener('DOMContentLoaded', function () {
        const btn = document.getElementById('mobileMenuBtnOrder');
        const panel = document.getElementById('mobileMenuOrder');
        const close = document.getElementById('mobileMenuCloseOrder');
        if (btn && panel) btn.addEventListener('click', () => panel.classList.toggle('hidden'));
        if (close && panel) close.addEventListener('click', () => panel.classList.add('hidden'));
      });
    </script>
</body>
</html>
